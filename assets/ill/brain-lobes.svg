    <text x="110" y="72" text-anchor="end" data-for="frontal-lobe" data-ax="150" data-ay="90">Frontal lobe</text>
    <text x="110" y="118" text-anchor="end" data-for="brocas-area" data-ax="166" data-ay="126">Broca's area</text>
    <text x="110" y="148" text-anchor="end" data-for="lateral-fissure" data-ax="176" data-ay="136">Lateral fissure</text>
    <text x="110" y="180" text-anchor="end" data-for="temporal-lobe" data-ax="192" data-ay="166">Temporal lobe</text>
    <text x="110" y="238" text-anchor="end" data-for="brainstem" data-ax="226" data-ay="234">Brainstem</text>
    <text x="258" y="28" data-for="somatosensory-cortex" data-ax="220" data-ay="72">Somatosensory cortex</text>
    <text x="304" y="56" data-for="central-sulcus" data-ax="206" data-ay="104">Central sulcus</text>
    <text x="304" y="82" data-for="parietal-lobe" data-ax="244" data-ay="78">Parietal lobe</text>
    <text x="304" y="112" data-for="occipital-lobe" data-ax="284" data-ay="112">Occipital lobe</text>
    <text x="304" y="142" data-for="wernickes-area" data-ax="242" data-ay="134">Wernicke's area</text>
    <text x="304" y="220" data-for="cerebellum" data-ax="280" data-ay="192">Cerebellum</text>
