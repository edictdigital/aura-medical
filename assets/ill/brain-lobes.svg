<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" data-title="Brain — lateral view" data-specialty="neurology" data-caption="Left cerebral hemisphere, lobes and key cortical areas (anterior to the left)"><style>text{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:9.5px;font-weight:500;fill:#2F3A40}.ld{stroke:#55636A;stroke-width:.8;fill:none}.ad{fill:#2F3A40}</style>
  <!-- brainstem and cerebellum sit behind / below the cerebrum -->
  <g id="r-brainstem">
    <path d="M214 168 L240 166 C242 196 238 222 234 254 L220 254 C220 234 214 222 210 214 C199 205 201 184 214 168 Z" fill="#EADFD6" stroke="#2F3A40" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M204 192 C214 196 228 196 240 192 M206 208 C216 211 228 211 239 208" fill="none" stroke="#6B7A82" stroke-width="1" stroke-linecap="round"/>
  </g>
