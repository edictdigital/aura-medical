    <path d="M240 182 C258 176 284 174 300 180 M236 191 C258 187 286 186 302 189 M242 200 C260 199 280 199 294 198" fill="none" stroke="#6B7A82" stroke-width="1" stroke-linecap="round"/>
  </g>

