    <path d="M230 94 C242 86 254 88 262 96" fill="none" stroke="#6B7A82" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <g id="r-temporal-lobe">
    <path d="M162 140 C172 136 182 135 192 134 C208 131 224 127 238 122 L262 124 C262 140 260 155 258 168 C236 180 196 184 170 178 C152 174 144 164 146 152 C148 144 154 140 162 140 Z" fill="#B5D396" stroke="#2F3A40" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M164 160 C190 152 222 147 254 146" fill="none" stroke="#6B7A82" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <g id="r-occipital-lobe">
