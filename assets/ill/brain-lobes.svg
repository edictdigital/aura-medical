    <path d="M280 92 C287 104 288 122 281 140" fill="none" stroke="#6B7A82" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- cortical strips either side of the central sulcus -->
  <g id="r-primary-motor-cortex">
    <path d="M214 56 C218 76 202 86 205 100 C208 114 194 120 192 134 L181 135 C183 120 197 114 194 100 C191 86 207 76 203 56 Z" fill="#5F84C8" stroke="#2F3A40" stroke-width="1" stroke-linejoin="round"/>
  </g>
  <g id="r-somatosensory-cortex">
    <path d="M214 56 C218 76 202 86 205 100 C208 114 194 120 192 134 L203 132 C205 120 219 114 216 100 C213 86 229 76 225 56 Z" fill="#E8C24A" stroke="#2F3A40" stroke-width="1" stroke-linejoin="round"/>
